<style>
  /* Visual language follows HeroUI's default theme: zinc neutrals, 12-14px radii, soft card shadows, flat and solid buttons. */

  .cat { fill:var(--ia-hi); stroke:var(--ia-hi); }
  .cat.nf { fill:none; stroke-width:2.2; }
  .eye { fill:var(--am); stroke:none; }
</style>
